[package]
name = "mosaic-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
quinn.workspace = true
tokio.workspace = true
subtle = "2.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
url = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
ring = "0.17"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"

[[test]]
name = "net_echo"
path = "tests/net/echo.rs"

[[test]]
name = "protocol_rejects"
path = "tests/protocol/rejects.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "net_isolation"
path = "tests/net/isolation.rs"

[[test]]
name = "net_egress"
path = "tests/net/egress.rs"

[[test]]
name = "net_dns"
path = "tests/net/dns.rs"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[test]]
name = "net_mtu"
path = "tests/net/mtu.rs"

[[test]]
name = "net_udp"
path = "tests/net/udp.rs"

[[test]]
name = "net_ipv6"
path = "tests/net/ipv6.rs"
