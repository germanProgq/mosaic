[package]
name = "mosaic-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
mosaic-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tempfile = "3"
ring = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
quinn.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
wintun = "0.5.1"
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Rpc", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rcgen = "0.14"
